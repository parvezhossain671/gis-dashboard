<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIS Location Finder</title><link rel="stylesheet" href="style.css"></head><body><main>
<h1>GIS Location Finder</h1>
<section><h2>Find Location</h2><label>Book No</label><select id="book"><option>Loading...</option></select><label>Account No</label><select id="account" disabled><option>Select Book No first</option></select><button id="search">SEARCH LOCATION</button><p id="status"></p></section>
<section><h2>Admin — KML Management</h2><p>Admin login is required.</p><div id="login"><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">ADMIN LOGIN</button></div>
<div id="admin" hidden><p id="who"></p><input id="file" type="file" accept=".kml,.xml"><button id="upload">UPLOAD KML</button><button id="logout">LOGOUT</button><p id="upstatus"></p>
<hr><h3>Delete Book No</h3><select id="deleteBook"><option>Select Book No</option></select><button id="deleteBtn">DELETE SELECTED BOOK</button><p id="deleteStatus"></p></div></section>
</main><script src="app.js"></script></body></html>
